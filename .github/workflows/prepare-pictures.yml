name: Prepare and validate Pictures
on:
  push:
    paths:
      - '.github/workflows/prepare-pictures.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import starter files and implement API
        run: |
          git clone --depth 1 https://github.com/ibm-developer-skills-network/luggb-Back-End-Development-Pictures.git /tmp/pictures-template
          cp -r /tmp/pictures-template/backend /tmp/pictures-template/bin /tmp/pictures-template/tests .
          cp /tmp/pictures-template/{app.py,Dockerfile,LICENSE,pytest.ini,requirements.txt,.gitignore} .
          cat > backend/routes.py <<'PY'
          from backend import app
          import json
          import os
          from flask import jsonify, request, abort
          with open(os.path.join(os.path.dirname(__file__), "data", "pictures.json")) as source:
              data = json.load(source)
          
          @app.route("/health")
          def health():
              return jsonify(status="OK"), 200
          
          @app.route("/count")
          def count():
              return jsonify(length=len(data)), 200
          
          @app.route("/picture", methods=["GET"])
          def get_pictures():
              return jsonify(data), 200
          
          @app.route("/picture/<int:id>", methods=["GET"])
          def get_picture_by_id(id):
              item = next((item for item in data if item["id"] == id), None)
              if item is None:
                  abort(404)
              return jsonify(item), 200
          
          @app.route("/picture", methods=["POST"])
          def create_picture():
              item = request.get_json()
              if any(row["id"] == item["id"] for row in data):
                  return jsonify(Message=f"picture with id {item['id']} already present"), 302
              data.append(item)
              return jsonify(item), 201
          
          @app.route("/picture/<int:id>", methods=["PUT"])
          def update_picture(id):
              for index, row in enumerate(data):
                  if row["id"] == id:
                      item = request.get_json()
                      item["id"] = id
                      data[index] = item
                      return jsonify(item), 200
              abort(404)
          
          @app.route("/picture/<int:id>", methods=["DELETE"])
          def delete_picture(id):
              for index, row in enumerate(data):
                  if row["id"] == id:
                      data.pop(index)
                      return "", 204
              abort(404)
          
          PY
      - name: Install dependencies
        run: pip install 'Flask==2.1.2' 'Werkzeug<3' Flask-Cors Flask-Talisman python-dotenv pytest
      - name: Run original tests and save evidence
        run: |
          set -o pipefail
          mkdir -p evidence
          python -m pytest -v --disable-warnings -k 'health or count' | tee evidence/exercise1-count-health-passing
          python -m pytest -v --disable-warnings -k 'not health and not count and not post and not update and not delete' | tee evidence/exercise2-get-pictures-passing
          python -m pytest -v --disable-warnings -k post | tee evidence/exercise4-post-picture-passing
          python -m pytest -v --disable-warnings | tee evidence/exercise6-delete-picture-passing
      - name: Save verified implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend bin tests app.py Dockerfile LICENSE pytest.ini requirements.txt .gitignore evidence
          git diff --cached --quiet || git commit -m "Implement Pictures service and save passing original tests"
          git push
